
name: Build AI-CHESS-Z Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AICHESSZ_1_0_5_PROJECT.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          ZIP="AICHESSZ_1_0_5_PROJECT.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Archive not found: $ZIP"
            ls -la
            exit 1
          fi

          unzip -t "$ZIP"
          mkdir -p project
          unzip -q "$ZIP" -d project

          SETTINGS="$(find project -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Gradle settings file not found"
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"
          packages: "platform-tools"

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          if ! find "$APK_DIR" -maxdepth 1 \
            -type f -name "*.apk" -print -quit 2>/dev/null \
            | grep -q .; then
            echo "::error::APK was not generated"
            find "$PROJECT_DIR" -path "*/build/outputs/*" -type f
            exit 1
          fi

          find "$APK_DIR" -maxdepth 1 \
            -type f -name "*.apk" -ls

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-CHESS-Z-debug-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
          
