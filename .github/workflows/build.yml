name: Build AI-CHESS-Z 1.4.3 Adaptive Combat FIX1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: AI-CHESS-Z Android APK FIX1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AI-CHESS-Z
        uses: actions/checkout@v4

      - name: Verify project archive
        shell: bash
        run: |
          ZIP="AI_CHESS_Z_Android_1_4_3_ADAPTIVE_COMBAT_FIX1.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Required archive not found: $ZIP"
            ls -lah
            exit 1
          fi

          echo "Archive verified: $ZIP"
          sha256sum "$ZIP"

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p android-project

          unzip -q \
            "AI_CHESS_Z_Android_1_4_3_ADAPTIVE_COMBAT_FIX1.zip" \
            -d android-project

          # Находим директорию, где находится файл gradlew или build.gradle / build.gradle.kts
          PROJECT_DIR=$(find android-project -type f \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" \) -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project root not found in archive."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory identified: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK & Accept Licenses
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          
          if [ -n "$SDKMGR" ]; then
            echo "Found sdkmanager at: $SDKMGR"
            yes | "$SDKMGR" --licenses || true
            "$SDKMGR" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"
          else
            echo "::error::sdkmanager not found!"
            exit 1
          fi

      - name: Prepare Gradle wrapper if missing
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "gradlew not found in archive. Generating Gradle wrapper..."
            gradle wrapper
          fi

          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Build AI-CHESS-Z APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      - name: Verify generated APK
        shell: bash
        run: |
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          APK=$(find "$APK_DIR" \
            -maxdepth 2 \
            -type f \
            -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload AI-CHESS-Z APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-CHESS-Z-1.4.3-Adaptive-Combat-FIX1-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          
