
name: Build AI-CHESS-Z 1.4.5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "AI_CHESS_Z_Android_*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f \
            -name 'AI_CHESS_Z_Android_*.zip' \
            -print -quit)"

          test -n "$ZIP" || {
            echo "ERROR: Project ZIP not found"
            exit 1
          }

          echo "Found project: $ZIP"

          mkdir -p android-project
          unzip -q "$ZIP" -d android-project

          SETTINGS="$(find android-project -type f \
            \( -name settings.gradle.kts \
            -o -name settings.gradle \) \
            -print -quit)"

          test -n "$SETTINGS" || {
            echo "ERROR: Gradle settings not found"
            exit 1
          }

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

          echo "Android SDK verified"

      - name: Ensure BuildConfig enabled
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_DIR/app/build.gradle.kts"

          python3 - "$FILE" <<'PY'
          import pathlib
          import re
          import sys

          p = pathlib.Path(sys.argv[1])
          s = p.read_text()

          if re.search(r'buildConfig\s*=\s*true', s):
              print("BuildConfig already enabled")

          else:
              m = re.search(r'buildFeatures\s*\{', s)

              if m:
                  s = (
                      s[:m.end()]
                      + '\n        buildConfig = true'
                      + s[m.end():]
                  )

              else:
                  m = re.search(r'android\s*\{', s)

                  if not m:
                      raise SystemExit(
                          "ERROR: android block not found"
                      )

                  s = (
                      s[:m.end()]
                      + '\n    buildFeatures {'
                      + '\n        buildConfig = true'
                      + '\n    }'
                      + s[m.end():]
                  )

              p.write_text(s)
              print("BuildConfig enabled")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-CHESS-Z-1.4.5-debug-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
          
