
name: Build AI-CHESS-Z 1.4.4 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project ZIP
        id: project
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::Project ZIP not found in repository root"
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Found project: $ZIP"

      - name: Extract project ZIP
        shell: bash
        run: |
          mkdir -p project
          unzip -q "${{ steps.project.outputs.zip }}" -d project

          echo "Extracted project structure:"
          find project -maxdepth 4 -type f | head -100

      - name: Locate Android Gradle project
        id: gradle
        shell: bash
        run: |
          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -n "$SETTINGS" ]; then
            ROOT=$(dirname "$SETTINGS")
          else
            BUILD_FILE=$(find project -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              | head -n 1)

            if [ -z "$BUILD_FILE" ]; then
              echo "::error::No Gradle build file found in ZIP"
              find project -maxdepth 5 -type f
              exit 1
            fi

            ROOT=$(dirname "$BUILD_FILE")
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project root: $ROOT"

          if [ -f "$ROOT/gradlew" ]; then
            echo "wrapper=true" >> "$GITHUB_OUTPUT"
            echo "Gradle Wrapper found"
          else
            echo "wrapper=false" >> "$GITHUB_OUTPUT"
            echo "Gradle Wrapper absent; using installed Gradle"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.gradle.outputs.wrapper == 'false'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: false

      - name: Install Android command-line tools
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          if [ ! -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p /tmp/android-cli

            curl -fL \
              https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip \
              -o /tmp/android-tools.zip

            unzip -q /tmp/android-tools.zip -d /tmp/android-cli

            cp -r /tmp/android-cli/cmdline-tools/* \
              "$ANDROID_HOME/cmdline-tools/latest/"
          fi

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME/licenses"

          printf '%s\n' \
            "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$ANDROID_HOME/licenses/android-sdk-license"

          printf '%s\n' \
            "84831b9409646a918e30573bab4c9c91346d8abd" \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK with Gradle Wrapper
        if: steps.gradle.outputs.wrapper == 'true'
        working-directory: ${{ steps.gradle.outputs.root }}
        shell: bash
        run: |
          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Build APK with installed Gradle
        if: steps.gradle.outputs.wrapper == 'false'
        working-directory: ${{ steps.gradle.outputs.root }}
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Locate generated APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.gradle.outputs.root }}" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated"
            echo "Searching build directory:"
            find "${{ steps.gradle.outputs.root }}" \
              -type f | grep -E "apk|gradle" | head -100
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK successfully generated: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-CHESS-Z-1.4.4-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          
