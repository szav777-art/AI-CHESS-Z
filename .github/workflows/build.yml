
name: Build AI-CHESS-Z 1.1.0 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AI_CHESS_Z_Android_1_1_0_UCI_STABILITY.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and validate project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="AI_CHESS_Z_Android_1_1_0_UCI_STABILITY.zip"
          test -f "$ZIP" || {
            echo "ERROR: Missing project ZIP: $ZIP"
            exit 1
          }

          mkdir -p android-project
          unzip -q "$ZIP" -d android-project

          SETTINGS="$(find android-project -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)"

          test -n "$SETTINGS" || {
            echo "ERROR: Gradle settings file not found"
            exit 1
          }

          PROJECT_DIR="$(dirname "$SETTINGS")"
          test -f "$PROJECT_DIR/app/build.gradle.kts" -o \
               -f "$PROJECT_DIR/app/build.gradle"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: "true"
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-CHESS-Z-1.1.0-debug-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
          
