
name: Build AI-CHESS-Z 1.4.4 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project ZIP
        id: project
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::Project ZIP not found in repository root"
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Found project: $ZIP"

      - name: Extract project ZIP
        shell: bash
        run: |
          mkdir -p project
          unzip -q "${{ steps.project.outputs.zip }}" -d project

      - name: Locate Gradle project
        id: gradle
        shell: bash
        run: |
          FILE=$(find project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "::error::Gradle settings file not found"
            exit 1
          fi

          DIR=$(dirname "$FILE")

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project directory: $DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e

          yes | sdkmanager --licenses

          LICENSE_STATUS=$?

          set -e

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "Checking SDK licenses..."
          fi

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Grant Gradle execution permission
        shell: bash
        working-directory: ${{ steps.gradle.outputs.dir }}
        run: |
          chmod +x gradlew

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ steps.gradle.outputs.dir }}
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --build-cache \
            assembleDebug

      - name: Locate generated APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.gradle.outputs.dir }}" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK successfully generated: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-CHESS-Z-1.4.4-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          
