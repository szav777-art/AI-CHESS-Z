
name: Build AI-CHESS-Z 1.4.4 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project ZIP
        id: project
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Found: $ZIP"

      - name: Extract project
        run: |
          mkdir project
          unzip -q "${{ steps.project.outputs.zip }}" -d project

      - name: Locate Gradle project
        id: gradle
        shell: bash
        run: |
          FILE=$(find project -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project: $DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Grant Gradle permission
        working-directory: ${{ steps.gradle.outputs.dir }}
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ${{ steps.gradle.outputs.dir }}
        run: |
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.gradle.outputs.dir }}" \
            -type f -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-CHESS-Z-1.4.4-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
          
