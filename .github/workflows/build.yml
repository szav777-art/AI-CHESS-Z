
name: Build AI-CHESS-Z 1.3.4 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AI_CHESS_Z_Android_1_2_8_SERIALIZED_UCI_ANALYSIS.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="AI_CHESS_Z_Android_1_2_8_SERIALIZED_UCI_ANALYSIS.zip"
          test -f "$ZIP"
          mkdir -p android-project
          unzip -q "$ZIP" -d android-project
          PROJECT_DIR="$(find android-project -type f -name settings.gradle.kts -print -quit | xargs dirname)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-CHESS-Z-1.3.4-debug-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
          
