name: Build APK AI-CHESS-Z

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' \
            ! -path './.git/*' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Project ZIP not found in repository root."
            exit 1
          fi

          echo "Project archive: $ZIP_FILE"
          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/project" -maxdepth 4 \
            \( -name gradlew -o -name settings.gradle \
            -o -name settings.gradle.kts \) -print

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(find "$GITHUB_WORKSPACE/project" \
            -type f -name gradlew | head -n 1 || true)"

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew not found inside project ZIP."
            echo "The archive may not contain a complete Gradle project."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          cd "$PROJECT_DIR"
          chmod +x gradlew

          ./gradlew --version
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-CHESS-Z-debug-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
