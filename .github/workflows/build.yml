name: Build AI-CHESS-Z 1.4.2 Engine Identity APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'AI_CHESS_Z_Android_*.zip'
      - 'AI_CHESS_Z_Android/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/project"
          ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'AI_CHESS_Z_Android_*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo 'ERROR: AI_CHESS_Z_Android_*.zip not found in repository root.'
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi
          echo "Archive found: $ZIP"
          unzip -oq "$ZIP" -d "$GITHUB_WORKSPACE/project"
          SETTINGS=$(find "$GITHUB_WORKSPACE/project" -type f -name 'settings.gradle.kts' -print -quit)
          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find "$GITHUB_WORKSPACE/project" -type f -name 'settings.gradle' -print -quit)
          fi
          if [ -z "$SETTINGS" ]; then
            echo 'ERROR: settings.gradle(.kts) not found after extraction.'
            find "$GITHUB_WORKSPACE/project" -maxdepth 4 -type f | head -80
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Enable BuildConfig if needed
        shell: bash
        run: |
          set -euo pipefail
          FILE="$PROJECT_DIR/app/build.gradle.kts"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: Gradle app file not found: $FILE"
            exit 1
          fi
          python3 -c 'import pathlib,re,sys; p=pathlib.Path(sys.argv[1]); s=p.read_text(); if re.search(r"buildConfig\\s*=\\s*true",s): print("BuildConfig already enabled") else: m=re.search(r"buildFeatures\\s*\\{",s) if m: s=s[:m.end()]+"\\n buildConfig = true"+s[m.end():] else: m=re.search(r"android\\s*\\{",s) if not m: raise SystemExit("android block not found") s=s[:m.end()]+"\\n buildFeatures {\\n buildConfig = true\\n }"+s[m.end():] p.write_text(s); print("Enabled BuildConfig")' "$FILE"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew 2>/dev/null || true
          if [ -f ./gradlew ]; then
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-CHESS-Z-1.4.2-debug-APK
          path: '${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
