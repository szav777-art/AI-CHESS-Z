name: Сборка AI-CHESS-Z 1.3.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Найти и распаковать проект
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -name "*.zip" -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ZIP-файл проекта не найден"
            exit 1
          fi

          mkdir -p android-project
          unzip -q "$ZIP" -d android-project

          GRADLEW=$(find android-project -type f -name gradlew -print -quit)
          if [ -z "$GRADLEW" ]; then
            echo "Файл gradlew не найден"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Принять лицензии и установить Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager не найден"
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Собрать APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Опубликовать APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-CHESS-Z-1.3.0-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
