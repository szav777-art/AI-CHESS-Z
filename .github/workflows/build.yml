
name: Build AI-CHESS-Z 1.4.2 Engine Identity APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "AI_CHESS_Z_Android_1_4_2_ENGINE_IDENTITY.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="AI_CHESS_Z_Android_1_4_2_ENGINE_IDENTITY.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found: $ZIP_FILE"
            echo "Files in repository root:"
            ls -la
            exit 1
          fi

          echo "Found project archive: $ZIP_FILE"

          mkdir -p extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project

          PROJECT_DIR="extracted_project/AI_CHESS_Z_Android"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: Expected project directory not found."
            echo "Extracted archive structure:"
            find extracted_project -maxdepth 4 -type f
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: Gradle wrapper gradlew not found."
            find "$PROJECT_DIR" -maxdepth 3 -type f
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle(.kts) not found."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            echo "ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Building AI-CHESS-Z 1.4.2"
          echo "Java version:"
          java -version

          echo "Gradle version:"
          ./gradlew --version

          ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory not found."
            exit 1
          fi

          APK_FILE="$(find "$APK_DIR" -maxdepth 1 -name '*.apk' -type f | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK_FILE"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-CHESS-Z-1.4.2-Engine-Identity-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
