
name: Сборка APK AI-CHESS-Z

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Создать APK для Android
    runs-on: ubuntu-latest

    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools'

      - name: Установить необходимые компоненты Android
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Найти и распаковать ZIP проекта
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f \
            -iname '*.zip' \
            ! -path './.git/*' \
            | head -n 1 || true)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::ZIP проекта не найден в репозитории"
            exit 1
          fi

          echo "Найден архив: $ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"

          BUILD_FILE="$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            -name build.gradle.kts \
            ! -path '*/app/*' \
            | head -n 1 || true)"

          if [ -z "$BUILD_FILE" ]; then
            echo "::error::Корневой build.gradle.kts не найден"
            find "$GITHUB_WORKSPACE/project" -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Каталог проекта: $PROJECT_DIR"

      - name: Настроить Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Проверить наличие APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "::error::APK после сборки не найден"
            exit 1
          fi

          echo "APK создан: $APK"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-CHESS-Z-debug-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
