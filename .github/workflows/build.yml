
name: Build AI-CHESS-Z 1.4.1 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "AI_CHESS_Z_Android_1_4_1_ANALYSIS_SYNC.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="AI_CHESS_Z_Android_1_4_1_ANALYSIS_SYNC.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP is missing from repository root."
            echo "Upload/commit the project ZIP to repository root."
            echo "ZIP files found:"
            find . -type f -name '*.zip' \
              -not -path './.git/*' -print || true
            exit 1
          fi

          mkdir -p android-project
          unzip -q "$ZIP" -d android-project

          SETTINGS="$(find android-project -type f \
            \( -name settings.gradle.kts \
            -o -name settings.gradle \) \
            -print -quit)"

          test -n "$SETTINGS" || {
            echo "ERROR: Gradle settings file not found"
            exit 1
          }

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Enable BuildConfig
        shell: bash
        run: |
          set -euo pipefail
          BUILD_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$BUILD_GRADLE" ]; then
            echo "ERROR: app/build.gradle.kts not found"
            exit 1
          fi

          python3 - "$BUILD_GRADLE" <<'PY'
          import pathlib, re, sys

          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')

          if re.search(
              r'buildFeatures\s*\{[^}]*buildConfig\s*=\s*true',
              s, re.S
          ):
              print('BuildConfig already enabled')
          elif re.search(r'android\s*\{', s):
              s = re.sub(
                  r'(android\s*\{)',
                  r'\1\n    buildFeatures {\n'
                  r'        buildConfig = true\n    }',
                  s, count=1
              )
              p.write_text(s, encoding='utf-8')
              print('Enabled buildFeatures.buildConfig')
          else:
              raise SystemExit(
                  'ERROR: android { block not found'
              )
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK and accept licenses
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=/usr/local/lib/android/sdk" \
            >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" \
            >> "$GITHUB_ENV"

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER" || {
            echo "ERROR: sdkmanager not found"
            exit 1
          }

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-CHESS-Z-1.4.1-debug-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
          
