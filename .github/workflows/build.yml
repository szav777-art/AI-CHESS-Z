name: Build AI-CHESS-Z Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AI-CHESS-Z_Android_1.0.5_UI_FEN_COMBAT.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Extract Android project
        run: |
          test -f AI-CHESS-Z_Android_1.0.5_UI_FEN_COMBAT.zip
          mkdir -p android-project
          unzip -q AI-CHESS-Z_Android_1.0.5_UI_FEN_COMBAT.zip -d android-project
          find android-project -name gradlew -type f

      - name: Locate project and prepare Gradle
        run: |
          PROJECT_DIR="$(dirname "$(find android-project -name gradlew -type f | head -n 1)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-CHESS-Z-1.0.5-debug-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
