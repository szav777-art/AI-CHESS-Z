
name: Build AI-CHESS-Z 1.3.5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**AI_CHESS_Z_Android_*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -name 'AI_CHESS_Z_Android_*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Android project ZIP not found in repository root."
            exit 1
          fi

          echo "Found archive: $ZIP"

          mkdir -p android-project
          unzip -q "$ZIP" -d android-project

          SETTINGS="$(find android-project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools'

      - name: Install required Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-CHESS-Z-1.3.5-debug-APK
          path: '${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
          
