name: Сборка APK AI-CHESS-Z

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Создать APK для Android
    runs-on: ubuntu-latest

    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Принять лицензии Android SDK
        run: yes | sdkmanager --licenses || true

      - name: Найти и распаковать ZIP проекта
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' \
            ! -path './.git/*' | head -n 1 || true)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::ZIP проекта не найден в репозитории."
            exit 1
          fi

          echo "Используется архив: $ZIP_FILE"
          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"

          echo "Структура проекта:"
          find "$GITHUB_WORKSPACE/project" -maxdepth 5 -type f \
            \( -name gradlew -o -name settings.gradle \
            -o -name settings.gradle.kts \) -print

      - name: Установить компоненты Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Собрать APK
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(find "$GITHUB_WORKSPACE/project" \
            -type f -name gradlew | head -n 1 || true)"

          if [ -z "$GRADLEW" ]; then
            echo "::error::В ZIP нет gradlew. Нужен полный Gradle-проект."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-CHESS-Z-debug-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
