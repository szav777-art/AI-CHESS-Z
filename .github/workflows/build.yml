name: Build AI-CHESS-Z Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AI-CHESS-Z_Android_1.0.5_UI_FEN_COMBAT.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        shell: bash
        run: |
          if [ ! -f "AI-CHESS-Z_Android_1.0.5_UI_FEN_COMBAT.zip" ]; then
            echo "::error::Project ZIP not found in repository root."
            exit 1
          fi
          unzip -t "AI-CHESS-Z_Android_1.0.5_UI_FEN_COMBAT.zip"

      - name: Extract project
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/android-project"
          unzip -q "AI-CHESS-Z_Android_1.0.5_UI_FEN_COMBAT.zip" \
            -d "$GITHUB_WORKSPACE/android-project"
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/android-project" \
            -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle.kts not found in ZIP."
            find "$GITHUB_WORKSPACE/android-project" -maxdepth 4 -type f
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-CHESS-Z-debug-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
