name: Build AI-CHESS-Z shell APK

on:
workflow_dispatch:
push:
branches: [ main, master ]
paths:
- 'AI-CHESS-Z_Android_Shell_OEX_0.7.zip'
- '.github/workflows/build.yml'

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
timeout-minutes: 45

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Locate and unpack project
    run: |
      echo "Repository files:"
      ls -la
      echo "ZIP archives:"
      find . -maxdepth 3 -type f -iname '*.zip' -print
      ZIP_FILE="$(find . -maxdepth 3 -type f -iname 'AI-CHESS-Z_Android_Shell_OEX_0.7.zip' -print -quit)"
      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: Project ZIP not found."
        exit 1
      fi
      mkdir -p project
      unzip -q "$ZIP_FILE" -d project
      echo "Extracted project files:"
      find project -maxdepth 3 -type f | head -100

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install Android SDK packages
    uses: android-actions/setup-android@v3

  - name: Accept licenses and install SDK
    run: |
      yes | sdkmanager --licenses
      sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build debug APK
    working-directory: project/AI_CHESS_Z_Android
    run: gradle --no-daemon --stacktrace :app:assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: AI-CHESS-Z-shell-debug-APK
      path: project/AI_CHESS_Z_Android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
