name: Build AI-CHESS-Z Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AI-CHESS-Z_Android_1.0.5_UI_FEN_COMBAT.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          test -f AI-CHESS-Z_Android_1.0.5_UI_FEN_COMBAT.zip
          mkdir -p android-project
          unzip -q AI-CHESS-Z_Android_1.0.5_UI_FEN_COMBAT.zip -d android-project
          PROJECT_DIR="$(find android-project -type f -name settings.gradle.kts -print -quit | xargs -r dirname)" test -n "$PROJECT_DIR" echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV" - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-CHESS-Z-1.0.5-debug-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
