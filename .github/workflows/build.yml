name: Build AI-CHESS-Z 1.3.4 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AI_CHESS_Z_Android_*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(ls AI_CHESS_Z_Android_*.zip 2>/dev/null | head -n 1)
          test -n "$ZIP" || {
            echo "ERROR: missing AI_CHESS_Z_Android_*.zip in repository root"
            exit 1
          }
          echo "Found ZIP archive: $ZIP"
          mkdir -p android-project
          unzip -q "$ZIP" -d android-project

          SETTINGS="$(find android-project -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)"

          test -n "$SETTINGS" || {
            echo "ERROR: Gradle settings file not found"
            exit 1
          }

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK & Accept Licenses
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-CHESS-Z-1.3.4-debug-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
          
