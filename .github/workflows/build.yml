
name: Build AI-CHESS-Z 1.4.3 Adaptive Combat APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "AI_CHESS_Z_Android_*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f \
            -name 'AI_CHESS_Z_Android_*.zip' -print -quit)"

          test -n "$ZIP" || {
            echo "ERROR: project ZIP missing in repository root"
            exit 1
          }

          mkdir -p android-project
          unzip -q "$ZIP" -d android-project

          SETTINGS="$(find android-project -type f \
            \( -name settings.gradle.kts \
            -o -name settings.gradle \) -print -quit)"

          test -n "$SETTINGS" || {
            echo "ERROR: Gradle settings file missing"
            exit 1
          }

          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          set -euo pipefail

          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-CHESS-Z-1.4.3-Adaptive-Combat-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
          
