
name: Сборка APK AI-CHESS-Z

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Создать APK для Android
    runs-on: ubuntu-latest

    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить компоненты Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Найти и распаковать ZIP проекта 1.0.4
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="AI-CHESS-Z_Android_1.0.4_KOTLIN_REGEX_FIX.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Не найден $ZIP_FILE в корне репозитория"
            echo "Содержимое корня репозитория:"
            ls -la
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"

          BUILD_FILE="$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            -name build.gradle.kts \
            ! -path '*/app/*' \
            -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "::error::Корневой build.gradle.kts не найден в ZIP"
            find "$GITHUB_WORKSPACE/project" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Проект: $PROJECT_DIR"

      - name: Настроить Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Проверить APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK не найден после сборки"
            exit 1
          fi

          echo "APK успешно создан: $APK"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-CHESS-Z-debug-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
